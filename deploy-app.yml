---
- name: Deploy applications with automatic rollback
  hosts: all
  become: yes

  vars_files:
    - vars/main.yml

  tasks:

    # =========================================================
    # DEPLOYMENT
    # =========================================================

    - name: Deploy application
      block:

        # =====================================================
        # NGINX
        # =====================================================

        - name: Create Nginx application directory
          file:
            path: /opt/nginx-app
            state: directory
            mode: '0755'

        - name: Create Nginx HTML page
          template:
            src: templates/index.html.j2
            dest: /opt/nginx-app/index.html
            mode: '0644'

        - name: Pull new Nginx image
          community.docker.docker_image:
            name: nginx
            tag: "{{ nginx_version }}"
            source: pull

        - name: Remove old Nginx container
          community.docker.docker_container:
            name: myapp
            state: absent

        - name: Start new Nginx container
          community.docker.docker_container:
            name: myapp
            image: "nginx:{{ nginx_version }}"
            state: started
            restart_policy: always
            published_ports:
              - "{{ nginx_port }}:80"
            volumes:
              - /opt/nginx-app/index.html:/usr/share/nginx/html/index.html:ro


        # =====================================================
        # APACHE
        # =====================================================

        - name: Create Apache application directory
          file:
            path: /opt/httpd-app
            state: directory
            mode: '0755'

        - name: Create Apache HTML page
          template:
            src: templates/httpd-index.html.j2
            dest: /opt/httpd-app/index.html
            mode: '0644'

        - name: Pull new Apache image
          community.docker.docker_image:
            name: httpd
            tag: "{{ httpd_version }}"
            source: pull

        - name: Remove old Apache container
          community.docker.docker_container:
            name: httpd-app
            state: absent

        - name: Start new Apache container
          community.docker.docker_container:
            name: httpd-app
            image: "httpd:{{ httpd_version }}"
            state: started
            restart_policy: always
            published_ports:
              - "{{ httpd_port }}:80"
            volumes:
              - /opt/httpd-app/index.html:/usr/local/apache2/htdocs/index.html:ro


        # =====================================================
        # REDIS
        # =====================================================

        - name: Pull new Redis image
          community.docker.docker_image:
            name: redis
            tag: "{{ redis_version }}"
            source: pull

        - name: Remove old Redis container
          community.docker.docker_container:
            name: redis-app
            state: absent

        - name: Start new Redis container
          community.docker.docker_container:
            name: redis-app
            image: "redis:{{ redis_version }}"
            state: started
            restart_policy: always
            published_ports:
              - "{{ redis_port }}:6379"


        # =====================================================
        # HEALTH CHECKS
        # =====================================================

        - name: Check Nginx application
          uri:
            url: "http://localhost:{{ nginx_port }}"
            status_code: 200
          register: nginx_health
          retries: 5
          delay: 2
          until: nginx_health.status == 200

        - name: Check Apache application
          uri:
            url: "http://localhost:{{ httpd_port }}"
            status_code: 200
          register: httpd_health
          retries: 5
          delay: 2
          until: httpd_health.status == 200

        - name: Check Redis
          command: docker exec redis-app redis-cli ping
          register: redis_health
          retries: 5
          delay: 2
          until: "'PONG' in redis_health.stdout"


        # =====================================================
        # DEPLOYMENT SUCCESS
        # =====================================================

        - name: Deployment successful
          debug:
            msg: "Deployment successful. Running version {{ app_version }}"

      # =======================================================
      # ROLLBACK
      # =======================================================

      rescue:

        - name: Deployment failed
          debug:
            msg: "Deployment failed. Starting automatic rollback."

        # =====================================================
        # ROLLBACK NGINX
        # =====================================================

        - name: Pull previous Nginx image
          community.docker.docker_image:
            name: nginx
            tag: "{{ nginx_previous_version }}"
            source: pull

        - name: Remove failed Nginx container
          community.docker.docker_container:
            name: myapp
            state: absent

        - name: Start previous Nginx version
          community.docker.docker_container:
            name: myapp
            image: "nginx:{{ nginx_previous_version }}"
            state: started
            restart_policy: always
            published_ports:
              - "{{ nginx_port }}:80"
            volumes:
              - /opt/nginx-app/index.html:/usr/share/nginx/html/index.html:ro


        # =====================================================
        # ROLLBACK APACHE
        # =====================================================

        - name: Pull previous Apache image
          community.docker.docker_image:
            name: httpd
            tag: "{{ httpd_previous_version }}"
            source: pull

        - name: Remove failed Apache container
          community.docker.docker_container:
            name: httpd-app
            state: absent

        - name: Start previous Apache version
          community.docker.docker_container:
            name: httpd-app
            image: "httpd:{{ httpd_previous_version }}"
            state: started
            restart_policy: always
            published_ports:
              - "{{ httpd_port }}:80"
            volumes:
              - /opt/httpd-app/index.html:/usr/local/apache2/htdocs/index.html:ro


        # =====================================================
        # ROLLBACK REDIS
        # =====================================================

        - name: Pull previous Redis image
          community.docker.docker_image:
            name: redis
            tag: "{{ redis_previous_version }}"
            source: pull

        - name: Remove failed Redis container
          community.docker.docker_container:
            name: redis-app
            state: absent

        - name: Start previous Redis version
          community.docker.docker_container:
            name: redis-app
            image: "redis:{{ redis_previous_version }}"
            state: started
            restart_policy: always
            published_ports:
              - "{{ redis_port }}:6379"


        # =====================================================
        # ROLLBACK HEALTH CHECK
        # =====================================================

        - name: Check Nginx after rollback
          uri:
            url: "http://localhost:8888"
            status_code: 200
          register: nginx_rollback_health
          retries: 5
          delay: 2
          until: nginx_rollback_health.status == 200

        - name: Check Apache after rollback
          uri:
            url: "http://localhost:{{ httpd_port }}"
            status_code: 200
          register: httpd_rollback_health
          retries: 5
          delay: 2
          until: httpd_rollback_health.status == 200

        - name: Check Redis after rollback
          command: docker exec redis-app redis-cli ping
          register: redis_rollback_health
          retries: 5
          delay: 2
          until: "'PONG' in redis_rollback_health.stdout"

        - name: Rollback successful
          debug:
            msg: "Rollback successful. Previous versions restored."

        - name: Stop playbook after rollback
          fail:
            msg: "Deployment failed, but rollback completed successfully."
